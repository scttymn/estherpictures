name: estherpictures

services:
  app:
    build: { context: ., target: dev }
    ports: ["127.0.0.1:4001:4000"] # this machine only (4000 is often taken here): in dev the folder is mounted and served
    environment:
      # Required on the server; houston test gives it a random value (long
      # enough for Phoenix). Carry Coolify's over so sessions survive the move.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # The canonical host for absolute URLs; www redirects to it (CanonicalHost).
      PHX_HOST: estherpictures.com
    volumes:
      - .:/app
      - data:/opt/estherpictures/data # the SQLite database (DATABASE_PATH) and uploads

volumes:
  data:

x-houston:
  health: /up
  commands:
    console:
      dev: iex -S mix
      server: bin/esther_pictures remote
    test: mix test
  hooks:
    release: bin/migrate
