name: estherpictures

services:
  app:
    build: { context: ., target: dev }
    expose: ["4000"]               # phx.server's port; houston dev serves it at http://estherpictures.localhost
    environment:
      # Required on the server; houston test gives it a random value (long
      # enough for Phoenix). Carry Coolify's over so sessions survive the move.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # The canonical host for absolute URLs; www redirects to it (CanonicalHost).
      PHX_HOST: estherpictures.com
    volumes:
      - .:/app
      - data:/opt/estherpictures/data # the SQLite database (DATABASE_PATH) and uploads

volumes:
  data:

x-houston:
  health: /up
  # Served here and at estherpictures.svnmns.com; www redirects to the apex
  # (CanonicalHost). Houston makes both CNAMEs to its tunnel.
  domains: [estherpictures.com, www.estherpictures.com]
  commands:
    console:
      dev: iex -S mix
      server: bin/esther_pictures remote
    test: mix test
  hooks:
    release: bin/migrate
