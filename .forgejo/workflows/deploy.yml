# Push-to-main deploy: builds a mix release, ships the tarball to the app VM,
# migrates, and restarts the systemd unit.
#
# The container is the public hexpm/elixir image on Debian BOOKWORM — its
# OpenSSL 3.0 / glibc match the Ubuntu 24.04 app VM, so the compiled crypto /
# bcrypt / exqlite NIFs load at runtime. (Do NOT switch to a trixie/OpenSSL-3.4
# image, or the release crashes on the VM with `OPENSSL_3.4.0 not found`.)
# Build tooling (git, ssh, node, build-essential, hex/rebar) is installed in the
# first step. deploy/Dockerfile.builder can bake all this into a registry image
# later for faster runs.
#
# Forgejo repo secrets required:
#   DEPLOY_SSH_KEY  — private key authorized for the deploy user
#   DEPLOY_HOST     — app VM LAN IP (192.168.0.54)
#   DEPLOY_USER     — "deploy"

name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: docker
    container:
      image: hexpm/elixir:1.19.5-erlang-28.1.1-debian-bookworm-20260623-slim
    env:
      MIX_ENV: prod
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git openssh-client tar gzip build-essential gnupg
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          mix local.hex --force
          mix local.rebar --force

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          MIX_ENV=test mix deps.get
          MIX_ENV=test mix test

      - name: Fetch prod dependencies
        run: mix deps.get --only prod

      - name: Build release
        run: |
          mix deps.compile
          mix compile
          mix assets.setup
          mix assets.deploy
          mix release --overwrite

      - name: Package tarball
        run: tar -czf esther_pictures-${RELEASE_SHA}.tar.gz -C _build/prod/rel esther_pictures

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host ${{ secrets.DEPLOY_HOST }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/deploy_key
          EOF
          chmod 600 ~/.ssh/config

      - name: Ship release to app VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp esther_pictures-${RELEASE_SHA}.tar.gz deploy/swap.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

      - name: Swap release and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "bash /tmp/swap.sh ${RELEASE_SHA}"
